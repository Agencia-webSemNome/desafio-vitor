<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/global.css">
    <script defer src="src/main.js"></script>
    <title>Document</title>
</head>

<body>
    <main class="form-card">
        <h1>Contact Us</h1>
        <form class="forms" action="https://formspree.io/f/meerrpgv" method="POST">

            <div class="section-names">           
                <div class="row-names">
                    <label for="firstname-area">First Name</label>
                    <input 
                    name="fisrtname" data-required="This field is required" id="firstname-area" class="text-input" type="text">
                    <p id="firstname-error" class="error-message"></p>
                </div>
                <div class="row-names">
                    <label for="lastname-area">Last Name</label>
                    <input name="lastname" data-required="This field is required" id="lastname-area" class="text-input" type="text">
                    <p id="lastname-error" class="error-message"></p>
                </div>
            </div>

            <div class="section-column">
                <label for="email-area">Email Adress</label>
                <input name="e-mail" data-required="This field is required" id="email-area" class="text-input" type="text">
                <p id="email-error" class="error-message"></p>
            </div>

            <div class="section-query">
                <label for="queryType-radio">Query Type</label>
                <div class="container-query">
                    <div class="query-selection" id="GeneralEnquiry">
                        <input class="radio-input" type="radio" name="queryType-radio" id="radio-1" aria-label="Seleção QueryType">
                        <p for="queryType-radio">General Enquiry</p>
                    </div>
                    <div class="query-selection" id="SupportRequest">
                        <input  class="radio-input" type="radio" name="queryType-radio" id="radio-2" aria-label="Seleção SupportRequest">
                        <p for="queryType-radio">Support Request</p>
                    </div>
                </div>
                <p id="querytype-error" class="error-message"></p>
            </div>

            <div class="section-column">
                <label for="message-area">Message</label>
                <textarea data-required="This field is required" class="textarea-input" name="message" id="textarea-message"></textarea>
                <p id="textarea-error" class="error-message"></p>
            </div>

            <div class="section-checkbox">
                <div class="container-checkbox">
                    <input data-required="To submit this form, please consent to being contacted"  id="permission-checkbox" class="checkbox-input" type="checkbox">
                    <label for="permission-checkbox" class="custom-label" for="contact permission">I Consent to being contacted by the team</label>
                </div>
                <p id="checkbox-error" class="error-message"></p>
            </div>
            <button type="submit" class="submit-button">Submit</button>
        </form>
    </main>
</body>

</html>
